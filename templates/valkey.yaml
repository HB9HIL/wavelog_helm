{{- $fn := include "wavelog.fullname" . -}}
{{- $checksum := include (print $.Template.BasePath "/valkey-config.yaml") . | sha256sum -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-valkey-headless
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # init.sh has to reach the sentinels of pods that are not ready yet
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ $fn }}-valkey-node
  ports:
    - name: valkey
      port: 6379
    - name: sentinel
      port: 26379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-valkey-node
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
spec:
  # init.sh, prestop.sh and haproxy.cfg assume exactly three nodes
  replicas: 3
  serviceName: {{ $fn }}-valkey-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fn }}-valkey-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $fn }}-valkey-node
        {{- include "wavelog.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ $checksum }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $fn }}-valkey-node
      initContainers:
        - name: init
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          command: [sh, /scripts/init.sh]
          env:
            {{- include "wavelog.valkeyEnv" . | nindent 12 }}
          volumeMounts:
            - name: conf
              mountPath: /conf
            - name: scripts
              mountPath: /scripts
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          command: [valkey-server, /conf/valkey.conf]
          env:
            {{- include "wavelog.valkeyEnv" . | nindent 12 }}
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: [sh, /scripts/prestop.sh]
          volumeMounts:
            - name: conf
              mountPath: /conf
            - name: scripts
              mountPath: /scripts
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
        - name: sentinel
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          command: [valkey-sentinel, /conf/sentinel.conf]
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            tcpSocket:
              port: sentinel
            periodSeconds: 5
          volumeMounts:
            - name: conf
              mountPath: /conf
          resources:
            {{- toYaml .Values.valkey.sentinel.resources | nindent 12 }}
      volumes:
        - name: conf
          emptyDir: {}
        - name: scripts
          configMap:
            name: {{ $fn }}-valkey
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fn }}-valkey-node
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fn }}-valkey-node
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-valkey-haproxy
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.valkey.haproxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fn }}-valkey-haproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $fn }}-valkey-haproxy
        {{- include "wavelog.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ $checksum }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $fn }}-valkey-haproxy
      containers:
        - name: haproxy
          image: "{{ .Values.valkey.haproxy.image.repository }}:{{ .Values.valkey.haproxy.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.haproxy.image.pullPolicy }}
          ports:
            - name: valkey
              containerPort: 6379
            - name: health
              containerPort: 8404
          # Not ready while no node answers as master
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
          resources:
            {{- toYaml .Values.valkey.haproxy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $fn }}-valkey
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fn }}-valkey-haproxy
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fn }}-valkey-haproxy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-valkey
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $fn }}-valkey-haproxy
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
