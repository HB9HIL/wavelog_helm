apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "wavelog.fullname" . }}-valkey
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
spec:
  {{- include "wavelog.pvcSpec" (dict "cfg" .Values.persistence.valkey "root" $) | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wavelog.fullname" . }}-valkey
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
spec:
  # Fixed at 1 - sessions, cache and worker coordination share one instance
  replicas: 1
  # Recreate: RollingUpdate would briefly put two Valkeys behind the same
  # service - clients would randomly hit the wrong one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "wavelog.fullname" . }}-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "wavelog.fullname" . }}-valkey
        {{- include "wavelog.labels" . | nindent 8 }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          # AOF in addition to the RDB defaults: sessions survive a restart
          # with at most 1s of loss
          args:
            - --appendonly
            - "yes"
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wavelog.fullname" . }}-valkey
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wavelog.fullname" . }}-valkey
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "wavelog.fullname" . }}-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey