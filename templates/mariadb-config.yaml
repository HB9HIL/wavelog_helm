{{- if .Values.mariadb.deploy_db }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wavelog.fullname" . }}-db-config
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
data:
  99-tuning.cnf: |
    [mariadbd]
    {{- range $key, $value := .Values.mariadb.config }}
    {{ $key }} = {{ $value }}
    {{- end }}
{{- end }}
