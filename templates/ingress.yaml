{{- if .Values.ingress.enabled }}
{{- $fullname := include "wavelog.fullname" . }}
{{- $hosts := concat (list .Values.ingress.host) (.Values.ingress.extraHosts | default list) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ $fullname }}-tls
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          # Before "/": the worker serves /ws itself, no rewrite needed
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-worker
                port:
                  name: worker-ws
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
    {{- end }}
{{- end }}
